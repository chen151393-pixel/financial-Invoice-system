services:
  app:
    build: .
    network_mode: host
    # 与本地后端保持文件覆盖顺序；兼容仅有 .env 或仅有 .env.local 的部署。
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
