services:
  app:
    build: .
    network_mode: host
    # 部署只加载 .env；.env.local 仅供本机直接运行后端时覆盖使用。
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
