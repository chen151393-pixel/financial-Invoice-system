services:
  app:
    build: .
    network_mode: host
    # 本机与部署统一只加载 .env，进程环境变量可覆盖。
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
